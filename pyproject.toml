[project]
name = "gridcheck"
version = "0.1.0"
description = "Grid occupancy checker: OpenCV board detection + PyTorch cell classifier"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "torch>=2.4",
    "torchvision>=0.19",
    "opencv-python>=4.10",
    "numpy>=1.26",
]

[project.optional-dependencies]
dev = ["pytest>=8", "gpiozero>=2.0"]
pi = ["gpiozero>=2.0"]   # Raspberry Pi status LEDs (see RASPBERRY_PI.md)

[project.scripts]
gridcheck = "gridcheck.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gridcheck"]

[tool.pytest.ini_options]
testpaths = ["tests"]

